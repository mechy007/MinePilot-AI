name: Addon Autonomy Tests
on:
  push:
    paths:
      - 'integration/addon-autonomy/**'
      - '.github/workflows/addon-autonomy-ci.yml'
  pull_request:
    paths:
      - 'integration/addon-autonomy/**'
      - '.github/workflows/addon-autonomy-ci.yml'
jobs:
  autonomy-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test autonomy core
        working-directory: integration/addon-autonomy
        run: npm test
