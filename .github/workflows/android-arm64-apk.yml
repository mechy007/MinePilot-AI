name: Android ARM64 Friend World APK
on:
  push:
    branches:
      - test/verify-existing-bedrock-learning-tasks
      - fix/runtime-terrain-and-manual-controls
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android build dependencies
        run: sdkmanager 'build-tools;35.0.0' 'platforms;android-35' 'ndk;28.0.13004108' 'cmake;3.22.1'
      - name: Verify and stage ARM64 Node
        run: bash scripts/stage-android-node-smoke.sh
      - name: Test Xbox sign-in program with synthetic account responses
        run: node --test scripts/android-xbox-auth-probe.test.cjs
      - name: Test Bedrock inventory, bridge and stack transaction contracts
        run: node --test scripts/bedrock-inventory-ledger.test.cjs scripts/bedrock-stack-request-manager.test.cjs scripts/bedrock-odyssey-observation-executor.test.cjs
      - name: Install engine build dependencies
        run: npm install --ignore-scripts --omit=optional
      - name: Test Bedrock terrain decoding and Android manual controls
        run: node --test scripts/bedrock-gameplay-bridge.test.cjs
      - name: Stage and test the Bedrock SDK bundle
        run: bash scripts/stage-android-bedrock-sdk.sh
      - name: Build ARM64 debug APK with Node and the Bedrock SDK
        working-directory: android
        run: gradle --no-daemon -PminepilotNodeSmoke=true :app:assembleDebug :app:testDebugUnitTest
      - name: Verify APK contents and 16 KB alignment
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 "$apk"
          python3 - "$apk" <<'PY'
          import sys
          from zipfile import ZipFile
          with ZipFile(sys.argv[1]) as apk:
              for name in ("libnode.so", "libminepilot_node_smoke.so", "libc++_shared.so"):
                  data = apk.read(f"lib/arm64-v8a/{name}")
                  assert data[:6] == bytes((0x7f, 0x45, 0x4c, 0x46, 0x02, 0x01)), name
                  assert int.from_bytes(data[18:20], "little") == 183, name
              for name in ("bedrock-sdk.zip", "Node.js-LICENSE.txt", "Node.js-Mobile-LICENSE.txt"):
                  assert apk.getinfo(f"assets/{name}").file_size > 0, name
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: minepilot-android-arm64-friend-world-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
