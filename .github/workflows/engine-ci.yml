name: Engine CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --omit=optional
      - run: npm install --no-save --ignore-scripts bedrock-protocol@3.61.0
      - run: npm test
      - name: Verify friend-world CLI reports missing SDK
        run: |
          if npm run --silent friend:check > readiness.json; then
            echo 'Expected friend:check to exit unsuccessfully without the SDK'
            exit 1
          fi
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const status = JSON.parse(readFileSync('readiness.json', 'utf8'));
          assert.equal(status.nodeSupported, true);
          assert.equal(status.sdkInstalled, false);
          assert.equal(status.readyForNodeJoinAttempt, false);
          assert.equal(status.androidEmbedded, false);
          JS
