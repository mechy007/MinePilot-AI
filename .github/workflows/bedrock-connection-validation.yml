name: Bedrock Connection Validation
on:
  workflow_dispatch:
  pull_request:
jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npm install --no-save --ignore-scripts bedrock-protocol@3.61.0
      - run: npm run build
      - run: node scripts/validate-bedrock-connection.mjs --dry-run
