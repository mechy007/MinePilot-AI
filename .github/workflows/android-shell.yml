name: Android Shell APK
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test RakNet ping codec with host compiler
        run: |
          cc -std=c11 -Wall -Wextra -Werror -o /tmp/test-raknet-ping tests/test_raknet_ping_codec.c
          /tmp/test-raknet-ping
          cc -std=c11 -Wall -Wextra -Werror -o /tmp/test-raknet-pong tests/test_raknet_pong_codec.c
          /tmp/test-raknet-pong
      - name: Build Android debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify ARM64 JNI library is packaged
        run: |
          python3 - <<'PY'
          import pathlib, zipfile
          apk = pathlib.Path("android/app/build/outputs/apk/debug/app-debug.apk")
          with zipfile.ZipFile(apk) as archive:
              names = set(archive.namelist())
              expected = "lib/arm64-v8a/libminepilot_bridge.so"
              assert expected in names, f"Missing {expected}"
              assert not any(name.startswith("lib/") and not name.startswith("lib/arm64-v8a/") for name in names), "Unexpected non-ARM64 native library"
              data = archive.read(expected)
              assert len(data) >= 64 and data[:4] == bytes([127,69,76,70]) and data[4] == 2 and data[5] == 1 and int.from_bytes(data[18:20], "little") == 183, "Invalid ARM64 ELF"
              print(f"Verified ARM64 JNI library ({len(data)} bytes); APK size {apk.stat().st_size} bytes")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: minepilot-android-shell-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
